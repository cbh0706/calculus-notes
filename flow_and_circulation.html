<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흐름 적분과 순환 - 단위원 실험</title>
<style>
  :root {
    --text: #2c2c2a; --text2: #5f5e5a; --card: #f4f3ee;
    --accent-bg: #e6f1fb; --accent-text: #0c447c; --accent-border: #378add;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #fff; color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 20px 40px; }
  h1 { font-size: 24px; font-weight: 500; margin: 0 0 4px; }
  .sub { font-size: 16px; color: var(--text2); margin: 0 0 16px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  button {
    font: inherit; font-size: 15px; padding: 8px 14px; cursor: pointer;
    border: 1px solid #b4b2a9; border-radius: 8px; background: #fff; color: var(--text);
  }
  button:hover { background: var(--card); }
  button.on { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent-border); }
  .ico { display: inline-block; vertical-align: -1px; margin-right: 6px; }
  .chk { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--text2); cursor: pointer; }
  .chk input { width: 16px; height: 16px; margin: 0; accent-color: #185fa5; }
  #stage { display: block; width: 100%; height: auto; margin-top: 12px; }
  .ts { font-size: 12px; fill: var(--text2); }
  .vlab { font-size: 14px; font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; font-size: 14px; color: var(--text2); margin-top: 6px; }
  .sw { display: inline-block; width: 16px; height: 4px; vertical-align: middle; margin-right: 6px; }
  .sw.band { height: 9px; opacity: 0.55; }
  .sw.dash { height: 0; border-top: 2px dashed #5f5e5a; }
  input[type=range] { flex: 1; min-width: 160px; accent-color: #185fa5; }
  #tval { min-width: 72px; font-size: 15px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 16px; }
  .card { background: var(--card); border-radius: 8px; padding: 12px 16px; }
  .card .lb { font-size: 14px; color: var(--text2); }
  .card .v { font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <h1>단위원 위의 흐름 적분과 순환</h1>
  <p class="sub">보라색 T는 진행 방향이고, F를 T 방향으로 내린 그림자의 길이 F·T를 한 바퀴 동안 쌓은 것이 순환입니다.</p>

  <div class="row" id="btns">
    <button data-k="uniform">균일 흐름 F = i</button>
    <button data-k="radial">방사형 F = xi + yj</button>
    <button data-k="spin">소용돌이 F = −yi + xj</button>
    <button data-k="ex7">예제 7 F = (x−y)i + xj</button>
  </div>

  <svg id="stage" viewBox="0 0 680 330" role="img" aria-label="왼쪽은 속도장과 단위원, 오른쪽은 t에 대한 F·T 그래프">
    <defs>
      <marker id="ah-grid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#a8a69e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
      <marker id="ah-F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2c2c2a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
      <marker id="ah-T" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>

    <!-- 왼쪽: 벡터장, 단위원, 점 P에서의 F와 T, F의 그림자 -->
    <g id="grid"></g>
    <line x1="20" y1="170" x2="320" y2="170" stroke="#d3d1c7" stroke-width="0.8"/>
    <line x1="170" y1="20" x2="170" y2="320" stroke="#d3d1c7" stroke-width="0.8"/>
    <g id="ring"></g>
    <line id="band" stroke-width="9" stroke-opacity="0.55" stroke-linecap="butt"/>
    <line id="vN" stroke="#5f5e5a" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line id="vF" stroke="#2c2c2a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah-F)"/>
    <line id="vT" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah-T)"/>
    <circle id="pt" r="4.5" fill="#2c2c2a"/>
    <text id="labF" class="vlab" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">F</text>
    <text id="labT" class="vlab" fill="#534AB7" text-anchor="middle" dominant-baseline="central">T</text>

    <!-- 오른쪽: t에 대한 F·T 그래프 -->
    <line x1="405" y1="112" x2="650" y2="112" stroke="#d3d1c7" stroke-width="0.6" stroke-dasharray="2 3"/>
    <line x1="405" y1="228" x2="650" y2="228" stroke="#d3d1c7" stroke-width="0.6" stroke-dasharray="2 3"/>
    <line x1="405" y1="77" x2="405" y2="263" stroke="#d3d1c7" stroke-width="0.8"/>
    <line x1="405" y1="170" x2="650" y2="170" stroke="#888780" stroke-width="0.8"/>
    <text class="ts" x="397" y="112" text-anchor="end" dominant-baseline="central">1</text>
    <text class="ts" x="397" y="170" text-anchor="end" dominant-baseline="central">0</text>
    <text class="ts" x="397" y="228" text-anchor="end" dominant-baseline="central">−1</text>
    <text class="ts" x="413" y="66">F·T</text>
    <text class="ts" x="658" y="170" dominant-baseline="central">t</text>
    <text class="ts" x="405" y="284" text-anchor="middle">0</text>
    <text class="ts" x="466" y="284" text-anchor="middle">π/2</text>
    <text class="ts" x="528" y="284" text-anchor="middle">π</text>
    <text class="ts" x="589" y="284" text-anchor="middle">3π/2</text>
    <text class="ts" x="650" y="284" text-anchor="middle">2π</text>
    <path id="areaPos" fill="#1D9E75" fill-opacity="0.28"/>
    <path id="areaNeg" fill="#D85A30" fill-opacity="0.28"/>
    <path id="curve" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
    <line id="cursor" stroke="#5f5e5a" stroke-width="0.8" stroke-dasharray="3 3"/>
    <circle id="dot" r="4"/>
    <text class="ts" x="405" y="312">칠한 넓이 = 0부터 t까지 쌓인 값</text>
  </svg>

  <div class="legend">
    <span><span class="sw" style="background:#534AB7"></span>T: 진행 방향 (단위접선벡터)</span>
    <span><span class="sw" style="background:#2c2c2a"></span>F: 그 점의 유체 속도</span>
    <span><span class="sw band" style="background:#1D9E75;margin-right:0"></span><span class="sw band" style="background:#D85A30"></span>F의 그림자(정사영) = 접선 성분 (F·T)T</span>
    <span><span class="sw dash"></span>원을 가로지르는 성분</span>
  </div>
  <div class="legend" style="margin-bottom:16px">
    <span><span class="sw" style="background:#1D9E75"></span>청록: T와 같은 쪽, 밀어줌 (F·T &gt; 0)</span>
    <span><span class="sw" style="background:#D85A30"></span>주황: T와 반대쪽, 거스름 (F·T &lt; 0)</span>
    <span><span class="sw" style="background:#888780"></span>회색: 원에 수직 (F·T = 0)</span>
  </div>

  <div class="row">
    <button id="play">한 바퀴 돌기</button>
    <input type="range" id="tslider" min="0" max="6.28" step="0.01" value="2">
    <span id="tval">t = 2.00</span>
  </div>
  <div class="row" style="margin-top:12px">
    <label class="chk"><input type="checkbox" id="shadowChk" checked>F의 그림자와 점선 보이기</label>
  </div>

  <div class="cards">
    <div class="card"><div class="lb">이 점에서 F·T</div><div class="v" id="valFT">0</div></div>
    <div class="card"><div class="lb">0부터 t까지 쌓인 값</div><div class="v" id="valCum">0</div></div>
    <div class="card"><div class="lb">한 바퀴 순환</div><div class="v" id="valTotal">0</div></div>
  </div>
</div>

<script>
// ===== 벡터장 목록 =====
// 새 장을 추가하려면 여기에 항목을 넣고, 위 버튼 줄에 data-k가 같은 버튼을 추가하세요.
// total은 한 바퀴 순환의 정확한 값(표시용)입니다. 생략하면 수치만 표시됩니다.
const FIELDS = {
  uniform: { F: (x, y) => [1, 0],     total: '0'  },
  radial:  { F: (x, y) => [x, y],     total: '0'  },
  spin:    { F: (x, y) => [-y, x],    total: '2π' },
  ex7:     { F: (x, y) => [x - y, x], total: '2π' },
};
const START_FIELD = 'ex7';   // 처음 보여줄 장
const LOOP_MS = 7000;        // 한 바퀴 도는 데 걸리는 시간(밀리초)

const COLOR = { pos: '#1D9E75', neg: '#D85A30', zero: '#888780', grid: '#a8a69e' };
const TAU = 2 * Math.PI, N = 720, H = TAU / N;
const CX = 170, CY = 170, S = 68;            // 왼쪽 그림: 원점 위치, 1단위 = 68px
const K = 0.6;                               // 점 P에서 F, T, 그림자를 그리는 공통 배율
const PX = 405, PW = 245, PY = 170, PS = 58; // 오른쪽 그래프 위치와 크기

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const X = x => CX + S * x, Y = y => CY - S * y;
const PXt = v => PX + PW * v / TAU, PYf = f => PY - PS * f;

let cur = START_FIELD, t = 2.0, playing = false, last = 0, smp = [], cum = [];

// 원 위의 점 (cos t, sin t)에서의 F·T. 단위원이므로 |r'(t)| = 1, 즉 ds = dt
function ft(k, v) {
  const c = Math.cos(v), s = Math.sin(v), F = FIELDS[k].F(c, s);
  return -F[0] * s + F[1] * c;
}
function tone(f) { return f > 0.03 ? 'pos' : (f < -0.03 ? 'neg' : 'zero'); }
function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const a in attrs) e.setAttribute(a, attrs[a]);
  return e;
}
// 수학 좌표의 두 점 a, b를 잇는 선분
function setSeg(id, a, b) {
  const e = $(id);
  e.setAttribute('x1', X(a[0])); e.setAttribute('y1', Y(a[1]));
  e.setAttribute('x2', X(b[0])); e.setAttribute('y2', Y(b[1]));
}
// 수학 좌표 (x, y)에 글자 배치
function setPos(id, x, y) {
  const e = $(id);
  e.setAttribute('x', X(x)); e.setAttribute('y', Y(y));
}

// 0~2π를 N등분해서 F·T 표본값과 누적 적분(사다리꼴 공식)을 미리 계산
function precompute() {
  smp = []; cum = [0];
  for (let i = 0; i <= N; i++) smp.push(ft(cur, i * H));
  for (let i = 1; i <= N; i++) cum.push(cum[i - 1] + (smp[i - 1] + smp[i]) * H / 2);
}
function cumAt(v) {
  const k = v / H, i = Math.max(0, Math.min(Math.floor(k), N - 1)), fr = k - i;
  const a = smp[i], b = smp[i + 1], m = a + (b - a) * fr;
  return cum[i] + (a + m) / 2 * H * fr;
}

function drawGrid() {
  const g = $('grid'); g.innerHTML = '';
  const G = [-1.75, -1.25, -0.75, -0.25, 0.25, 0.75, 1.25, 1.75], F = FIELDS[cur].F;
  let mx = 0;
  G.forEach(a => G.forEach(b => { const w = F(a, b); mx = Math.max(mx, Math.hypot(w[0], w[1])); }));
  G.forEach(a => G.forEach(b => {
    const w = F(a, b), m = Math.hypot(w[0], w[1]);
    if (m < 1e-9) return;
    const L = 0.42 * m / mx, dx = w[0] / m * L / 2, dy = w[1] / m * L / 2;
    g.appendChild(el('line', {
      x1: X(a - dx), y1: Y(b - dy), x2: X(a + dx), y2: Y(b + dy),
      stroke: COLOR.grid, 'stroke-width': 1, 'marker-end': 'url(#ah-grid)'
    }));
  }));
}

function drawRing() {
  const g = $('ring'); g.innerHTML = '';
  const M = 120;
  for (let i = 0; i < M; i++) {
    const a0 = i * TAU / M, a1 = (i + 1) * TAU / M, f = ft(cur, (a0 + a1) / 2);
    g.appendChild(el('path', {
      d: `M${X(Math.cos(a0))} ${Y(Math.sin(a0))} A${S} ${S} 0 0 0 ${X(Math.cos(a1))} ${Y(Math.sin(a1))}`,
      fill: 'none', stroke: COLOR[tone(f)], 'stroke-width': 4
    }));
  }
}

function drawCurve() {
  let d = '';
  for (let i = 0; i <= N; i += 4) d += (i ? 'L' : 'M') + PXt(i * H).toFixed(1) + ' ' + PYf(smp[i]).toFixed(1);
  $('curve').setAttribute('d', d);
}

function drawArea(v) {
  const k = Math.min(Math.floor(v / H), N);
  let p = `M${PX} ${PY}`, n = `M${PX} ${PY}`;
  for (let i = 0; i <= k; i++) {
    const x = PXt(i * H).toFixed(1), f = smp[i];
    p += `L${x} ${PYf(Math.max(f, 0)).toFixed(1)}`;
    n += `L${x} ${PYf(Math.min(f, 0)).toFixed(1)}`;
  }
  const f = ft(cur, v), x = PXt(v).toFixed(1);
  p += `L${x} ${PYf(Math.max(f, 0)).toFixed(1)}L${x} ${PY}Z`;
  n += `L${x} ${PYf(Math.min(f, 0)).toFixed(1)}L${x} ${PY}Z`;
  $('areaPos').setAttribute('d', p);
  $('areaNeg').setAttribute('d', n);
}

const fmt = v => (Math.abs(v) < 0.005 ? 0 : v).toFixed(2).replace('-', '−');

function update() {
  const c = Math.cos(t), s = Math.sin(t), P = [c, s];
  const F = FIELDS[cur].F(c, s);
  const Tv = [-s, c];                                   // 단위접선벡터 T: 항상 진행(반시계) 방향
  const f = F[0] * Tv[0] + F[1] * Tv[1];                // F·T
  const fn = F[0] * c + F[1] * s;                       // F·n (n = 바깥쪽 단위법선)
  const tipF = [c + K * F[0], s + K * F[1]];
  const tipT = [c + K * Tv[0], s + K * Tv[1]];
  const foot = [c + K * f * Tv[0], s + K * f * Tv[1]];  // 그림자 끝 = P + K(F·T)T
  const tn = tone(f), show = $('shadowChk').checked;

  setSeg('band', P, foot);
  $('band').setAttribute('stroke', COLOR[tn]);
  $('band').setAttribute('visibility', show && Math.abs(f) > 0.01 ? 'visible' : 'hidden');
  setSeg('vN', foot, tipF);
  $('vN').setAttribute('visibility', show ? 'visible' : 'hidden');
  setSeg('vF', P, tipF);
  setSeg('vT', P, tipT);
  $('pt').setAttribute('cx', X(c)); $('pt').setAttribute('cy', Y(s));

  // 라벨: F는 화살표 끝 너머, T는 F가 없는 쪽(원 안 또는 밖)에 두어 겹치지 않게
  const mF = Math.hypot(F[0], F[1]) || 1;
  setPos('labF', tipF[0] + 0.22 * F[0] / mF, tipF[1] + 0.22 * F[1] / mF);
  const side = fn >= 0 ? -0.3 : 0.3;
  setPos('labT', c + 0.3 * Tv[0] + side * c, s + 0.3 * Tv[1] + side * s);

  drawArea(t);
  const gx = PXt(t), cu = $('cursor');
  cu.setAttribute('x1', gx); cu.setAttribute('y1', PY - PS * 1.6);
  cu.setAttribute('x2', gx); cu.setAttribute('y2', PY + PS * 1.6);
  $('dot').setAttribute('cx', gx); $('dot').setAttribute('cy', PYf(f)); $('dot').setAttribute('fill', COLOR[tn]);

  $('valFT').textContent = fmt(f);
  $('valCum').textContent = fmt(cumAt(t));
  const tot = FIELDS[cur].total;
  $('valTotal').textContent = tot === '0' ? '0' : (tot ? tot + ' ≈ ' : '') + fmt(cum[N]);
  $('tval').textContent = 't = ' + t.toFixed(2);
  $('tslider').value = t;
}

function select(k) {
  cur = k; precompute(); drawGrid(); drawRing(); drawCurve();
  document.querySelectorAll('#btns button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  update();
}

const PLAY = '<svg class="ico" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1L11 6L2 11Z" fill="currentColor"/></svg>한 바퀴 돌기';
const PAUSE = '<svg class="ico" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1" width="3" height="10" fill="currentColor"/><rect x="7" y="1" width="3" height="10" fill="currentColor"/></svg>멈춤';

function stop() { playing = false; $('play').innerHTML = PLAY; }
function step(now) {
  if (!playing) return;
  const dt = last ? now - last : 16; last = now;
  t += dt * TAU / LOOP_MS;
  if (t >= TAU) { t = TAU; update(); stop(); return; }
  update();
  requestAnimationFrame(step);
}

document.querySelectorAll('#btns button').forEach(b => b.addEventListener('click', () => select(b.dataset.k)));
$('tslider').addEventListener('input', e => { t = +e.target.value; stop(); update(); });
$('shadowChk').addEventListener('change', update);
$('play').addEventListener('click', () => {
  if (playing) { stop(); return; }
  if (t >= 6.27) t = 0;
  playing = true; last = 0;
  $('play').innerHTML = PAUSE;
  requestAnimationFrame(step);
});

stop();
select(START_FIELD);
</script>
</body>
</html>
